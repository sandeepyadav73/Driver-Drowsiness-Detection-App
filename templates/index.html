<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Driver Drowsiness Detection</title>

    <!-- IMPORTANT: Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: white;
            font-family: "Segoe UI", Arial, sans-serif;
            text-align: center;
        }

        header {
            padding: 15px;
            background: #020617;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
        }

        header p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .container {
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-wrapper {
            width: 100%;
            max-width: 720px;
            margin-top: 15px;
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid #22c55e;
            background: black;
        }

        .video-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            background: #020617;
            border-radius: 8px;
            width: 100%;
            max-width: 720px;
            font-size: 0.9rem;
            color: #e5e7eb;
        }

        footer {
            margin-top: 20px;
            padding: 10px;
            font-size: 0.75rem;
            color: #64748b;
        }

        /* Bigger text on large screens */
        @media (min-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>🚗 Driver Drowsiness Detection</h1>
    <p>Real-time Eye & Yawn Monitoring System</p>
</header>

<div class="container">

    <div class="video-wrapper">
        <img src="{{ url_for('video_feed') }}" alt="Live Camera Feed">
    </div>

    <div class="status">
        👀 Monitoring driver alertness in real time.<br>
        🔊 Alarm will trigger if drowsiness is detected.
    </div>

</div>

<footer>
    © 2026 | AI Safety Project | Flask + OpenCV
</footer>

</body>
</html>
