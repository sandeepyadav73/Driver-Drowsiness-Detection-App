<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Driver Drowsiness Detection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      * {
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        background: linear-gradient(135deg, #020617, #0f172a);
        color: white;
        font-family: 'Segoe UI', Arial, sans-serif;
        text-align: center;
      }
      
      header {
        padding: 15px;
        background: #020617;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      }
      
      .container {
        padding: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      
      .video-wrapper {
        width: 100%;
        max-width: 720px;
        margin-top: 15px;
        border-radius: 12px;
        overflow: hidden;
        border: 4px solid #22c55e;
        background: black;
      }
      
      .video-wrapper img {
        width: 100%;
      }
      
      .status {
        margin-top: 15px;
        padding: 10px;
        background: #020617;
        border-radius: 8px;
        width: 100%;
        max-width: 720px;
        font-size: 0.9rem;
      }
      
      .alert {
        color: red;
        font-weight: bold;
      }
      
      button {
        margin-top: 10px;
        padding: 8px 18px;
        border: none;
        border-radius: 6px;
        background: #22c55e;
        font-weight: bold;
        cursor: pointer;
      }
      
      footer {
        margin-top: 20px;
        font-size: 0.75rem;
        color: #64748b;
      }
    </style>
  </head>

  <body>
    <header>
      <h2>🚗 Driver Drowsiness Detection</h2>
      <p>Real-time Eye & Yawn Monitoring</p>
    </header>

    <div class="container">
      <div class="video-wrapper">
        <img src="{{ url_for('video_feed') }}" />
      </div>

      <div class="status" id="statusText">👀 Monitoring driver alertness...</div>

      <button onclick="enableAudio()">🔊 Enable Alarm Sound</button>
    </div>

    <footer>© 2026 | Flask + OpenCV</footer>

    <audio id="alarmSound" src="/static/alarm.wav"></audio>

    <script>
      let playing = false
      let audioEnabled = false
      
      function enableAudio() {
        let a = document.getElementById('alarmSound')
        a.play()
        a.pause()
        audioEnabled = true
        alert('Alarm Enabled')
      }
      
      setInterval(() => {
        fetch('/alarm_status')
          .then((r) => r.json())
          .then((d) => {
            const alarm = document.getElementById('alarmSound')
            const status = document.getElementById('statusText')
      
            if (d.alarm && audioEnabled) {
              status.innerHTML = '⚠ DRIVER DROWSY!'
              status.classList.add('alert')
      
              if (!playing) {
                alarm.play()
                playing = true
              }
            } else {
              status.innerHTML = '👀 Monitoring driver alertness...'
              status.classList.remove('alert')
              alarm.pause()
              alarm.currentTime = 0
              playing = false
            }
          })
      }, 1000)
    </script>
  </body>
</html>
